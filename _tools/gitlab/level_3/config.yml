aws-tools:
  stage: level_3
  before_script:
    # IP override removed - using DNS now
    # - echo $nfqhub_ip_os docker.nfq.lt >> /etc/hosts  # Commented out - using DNS now
    - docker login -u $dockerhub_user -p $dockerhub_token
    - docker login -u $nfqhub_user -p $nfqhub_token https://docker.nfq.lt
  script: 'cd aws-tools && make all-amd64 && make push-manifest && make publish && make clean'
  needs: [{job: aws-tools_arm64, optional: true}]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - changes:
        - "aws-tools/**/*"
        - "_tools/makefiles/**/*"
        - "_tools/helpers/**/*"
        - "toolbox-bookworm/**/*"
        - "debian-bookworm/**/*"
      when: on_success
    - when: never
  tags: [nfq_ip]
aws-tools_arm64:
  stage: level_3
  before_script:
    # IP override removed - using DNS now
    # - echo $nfqhub_ip_aws docker.nfq.lt >> /etc/hosts  # Commented out - using DNS now
    - docker login -u $dockerhub_user -p $dockerhub_token
    - docker login -u $nfqhub_user -p $nfqhub_token https://docker.nfq.lt
  script: 'cd aws-tools && make all-arm64 && make clean'
  tags: [arm]
  needs: [{job: "toolbox-bookworm", optional: true}]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - if: $MANUAL == "true"
      when: manual
      allow_failure: false
    - changes:
        - "aws-tools/**/*"
        - "_tools/makefiles/**/*"
        - "_tools/helpers/**/*"
        - "toolbox-bookworm/**/*"
        - "debian-bookworm/**/*"
